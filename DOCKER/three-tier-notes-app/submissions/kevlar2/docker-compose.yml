services:
  proxy:
    image: nginx:alpine
    # container_name: frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # This takes precedence
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
  
  api:
    build:
      context: ./
      dockerfile: Dockerfile
    # container_name: notes-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - frontend
      - backend
  
  db:
    image: postgres:16
    # container_name: db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

      
volumes:
  postgres_data:

networks:
  frontend:
    driver: bridge
  backend:   
    driver: bridge