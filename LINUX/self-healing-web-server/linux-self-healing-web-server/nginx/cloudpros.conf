server {
    listen 80;      # Listen for visitors arriving at the front door (Port 80)
    server_name _;  # Respond to any IP address or domain name

    location / {
        # Take the visitor and pass them to the app running on port 8000
        proxy_pass http://127.0.0.1:8000; 
        
        # Hand over the visitor's real information (like their actual IP address)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
